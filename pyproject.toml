[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-medical-formulas"
version = "1.0.2"
description = "Medical scoring formulas — Laer Tool Execution API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
slim = [
  "numpy>=1.26",
]
tap = [
  "google-genai>=1.0",
]
platform = [
  # Private package — not on public PyPI. Needed only to serve HTTP / TAP.
  "laer-platform>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tool_medical_formulas = ["tap/prompts/*.md"]
